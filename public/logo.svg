<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C75B12"/>
      <stop offset="100%" style="stop-color:#E87E3A"/>
    </linearGradient>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#81C784"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#logoGrad)" opacity="0.1"/>
  
  <!-- Table top -->
  <ellipse cx="100" cy="75" rx="60" ry="20" fill="url(#logoGrad)"/>
  
  <!-- Table legs -->
  <rect x="50" y="75" width="8" height="55" rx="4" fill="#1E1B18"/>
  <rect x="142" y="75" width="8" height="55" rx="4" fill="#1E1B18"/>
  
  <!-- Clock circle -->
  <circle cx="135" cy="55" r="28" fill="white" stroke="url(#clockGrad)" stroke-width="4"/>
  
  <!-- Clock hands -->
  <line x1="135" y1="55" x2="135" y2="38" stroke="#1E1B18" stroke-width="3" stroke-linecap="round"/>
  <line x1="135" y1="55" x2="147" y2="55" stroke="#1E1B18" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Clock center dot -->
  <circle cx="135" cy="55" r="3" fill="#C75B12"/>
  
  <!-- Coffee cup on table -->
  <ellipse cx="75" cy="68" rx="10" ry="5" fill="white" opacity="0.9"/>
  <path d="M 65 68 Q 65 80 75 80 Q 85 80 85 68" fill="white" opacity="0.9"/>
  <path d="M 85 70 Q 90 70 90 75 Q 90 80 85 80" fill="none" stroke="white" stroke-width="2" opacity="0.9"/>
  
  <!-- Steam -->
  <path d="M 72 62 Q 75 55 72 50" fill="none" stroke="white" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <path d="M 78 60 Q 75 53 78 48" fill="none" stroke="white" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
</svg>
